services:
  stockfish-api:
    build: .
    ports:
      # Loopback by default. Put TLS/authenticated ingress in front before exposing it.
      - "127.0.0.1:${OPENMOVE_PORT:-8080}:8080"
    environment:
      OPENMOVE_API_KEY: ${OPENMOVE_API_KEY:?set OPENMOVE_API_KEY}
      STOCKFISH_THREADS: "1"
      STOCKFISH_HASH_MB: "64"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
